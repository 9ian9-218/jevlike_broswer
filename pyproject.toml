[project]
name = "scenario5-browser-agent"
version = "0.1.0"
description = "Dual-track Browser Automation Agent (Fast/Slow Path with DOM Verifier)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "DrissionPage>=4.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "huggingface_hub>=0.30",
    "transformers>=4.40",
    "safetensors>=0.4",
    "torch>=2.0",
    "laya>=0.3.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
